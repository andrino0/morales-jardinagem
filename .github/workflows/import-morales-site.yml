name: Import original Morales Jardinagem website
on:
  pull_request_target:
    types: [opened]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download original site package
        run: curl -fL --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3LnQaxSZGmaUxJe902hriTtUGof/debaea70-486e-47dd-a766-c5fa05288239.zip" -o /tmp/morales-site.zip
      - name: Extract website source
        run: unzip -oq /tmp/morales-site.zip -d .
      - name: Commit imported website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!.github/workflows/**'
          if ! git diff --cached --quiet; then
            git commit -m "Import original Morales Jardinagem website"
            git push
          fi
